name: Deploy Plate Picks Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 YOUR_SERVER_IP >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 22 -o StrictHostKeyChecking=yes minwoo@YOUR_SERVER_IP "echo SSH_OK"

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 22 minwoo@YOUR_SERVER_IP << 'EOF'
            set -euxo pipefail
            cd /home/minwoo/Plate-Picks-Backend
            git fetch origin
            git checkout main
            git reset --hard origin/main
            docker compose up -d --build
            docker ps
          EOF
